name: Check Formatting

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  python-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Black
        run: pip install black

      - name: Check formatting in app/
        run: black --check --diff app/
